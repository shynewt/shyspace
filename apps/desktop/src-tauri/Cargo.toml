[package]
name = "shyspace-desktop"
version = "0.1.3"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
name = "shyspace_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
vendored-openssl = ["shy-core/vendored-openssl"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
shy-core = { path = "../../../crates/shy-core" }
shy-media = { path = "../../../crates/shy-media" }
serde = { version = "1", features = ["derive"] }
# tauri::generate_context! builds the plugins section of tauri.conf.json with it.
serde_json = "1.0.154"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0.104"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAppleEventDescriptor", "NSAppleEventManager", "NSArray", "NSBundle", "NSError", "NSObject", "NSSet", "NSString", "NSURL", "objc2-core-services"] }
block2 = "0.6"
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std",
    "bitflags",
    "block2",
    "UNNotification",
    "UNNotificationAction",
    "UNNotificationAttachment",
    "UNNotificationCategory",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationSettings",
    "UNNotificationSound",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
auto-launch = "0.6"

# The workspace's lints, except that `unsafe_code` is denied rather than
# forbidden here, so `notify_macos.rs` alone can allow it to call Apple's
# notification API. A test checks no other file does.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
