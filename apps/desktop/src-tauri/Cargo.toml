[package]
name = "shyspace-desktop"
version = "0.1.1"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
name = "shyspace_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
vendored-openssl = ["shy-core/vendored-openssl"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
shy-core = { path = "../../../crates/shy-core" }
shy-media = { path = "../../../crates/shy-media" }
serde = { version = "1", features = ["derive"] }
# tauri::generate_context! builds the plugins section of tauri.conf.json with it.
serde_json = "1.0.154"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0.104"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-clipboard-manager = "2"

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
