[package]
name = "shy-ffi"
version = "0.1.4"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib", "lib"]

[features]
# Builds the binding generator (`cargo run -p shy-ffi --features bindgen --bin uniffi-bindgen`).
bindgen = ["uniffi/cli"]
# Adds `ShyApp.withMemoryBucket`, for tests and demos; never in a release.
memory-bucket = ["shy-core/memory-bucket"]
vendored-openssl = ["shy-core/vendored-openssl"]

[dependencies]
anyhow = "1.0.104"
shy-core = { path = "../shy-core", features = ["ffi"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
uniffi = "0.31"
zeroize = "1"

# Matches the versions reqwest brings in; Android needs the verifier set up over JNI.
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22", default-features = false }
rustls-platform-verifier = "0.7"

[dev-dependencies]
shy-core = { path = "../shy-core", features = ["ffi", "memory-bucket"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[[bin]]
name = "uniffi-bindgen"
required-features = ["bindgen"]

[lints]
workspace = true
