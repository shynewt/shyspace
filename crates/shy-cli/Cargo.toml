[package]
name = "shy-cli"
version = "0.1.3"
edition = "2024"
license = "AGPL-3.0-only"

[[bin]]
name = "shy"
path = "src/main.rs"

[features]
vendored-openssl = ["shy-core/vendored-openssl"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4", features = ["derive", "env"] }
rmcp = { version = "3.11", features = ["server", "transport-io", "macros"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
shy-core = { version = "0.1.0", path = "../shy-core" }
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true
