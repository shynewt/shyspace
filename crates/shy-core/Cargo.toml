[package]
name = "shy-core"
version = "0.1.4"
edition = "2024"
license = "AGPL-3.0-only"

[features]
# Builds OpenSSL into the app for SQLCipher, so release builds don't depend on
# a system copy (macOS and Windows have none). Needs Perl to build; local
# development uses the system's OpenSSL.
vendored-openssl = ["rusqlite/bundled-sqlcipher-vendored-openssl"]
# Makes the read models usable from Swift and Kotlin (crates/shy-ffi).
ffi = ["dep:uniffi"]
# A bucket kept in memory, for tests and demos of the phone apps; never in a release.
memory-bucket = []

[dependencies]
aead-stream = { version = "0.6", features = ["alloc"] }
anyhow = "1.0.104"
base64 = "0.22"
blake3 = "1.8"
bytes = "1.12.2"
chacha20poly1305 = { version = "0.11", features = ["getrandom"] }
futures-lite = "2.6.1"
hex = "0.4.3"
iroh = "1.5"
iroh-gossip = "0.103"
keyring = "4"
object_store = { version = "0.14", features = ["aws"] }
openmls = "0.9"
openmls_basic_credential = "0.6"
openmls_rust_crypto = "0.6"
openmls_sqlite_storage = "0.3"
openmls_traits = "0.6"
postcard = { version = "1", features = ["use-std"] }
pulldown-cmark = { version = "0.13", default-features = false }
rand = "0.10.4"
reqwest = { version = "0.13", default-features = false }
rusqlite = { version = "0.37", features = ["bundled-sqlcipher", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
uniffi = { version = "0.31", optional = true }
tracing = "0.1.44"
# Pinned to the version of the patched copy in vendor/yrs.
yrs = "=0.28.1"
zeroize = "1"

# keyring's Apple store builds for iOS only with its "protected" store. The iOS app keeps device
# keys itself (HostKeyStore), but the store still has to compile there.
[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["protected"] }

[dev-dependencies]
async-trait = "0.1"
rusqlite = { version = "0.37", features = ["hooks"] }

[lints]
workspace = true
