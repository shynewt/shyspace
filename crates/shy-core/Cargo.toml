[package]
name = "shy-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
blake3 = "1.8"
bytes = "1.12.2"
chacha20poly1305 = { version = "0.11", features = ["getrandom"] }
futures-lite = "2.6.1"
hex = "0.4.3"
iroh = "1.5"
iroh-gossip = "0.103"
keyring = "4"
object_store = { version = "0.14", features = ["aws"] }
openmls = "0.9"
openmls_basic_credential = "0.6"
openmls_rust_crypto = "0.6"
openmls_sqlite_storage = "0.3"
openmls_traits = "0.6"
postcard = { version = "1", features = ["use-std"] }
rand = "0.10.4"
reqwest = { version = "0.13", default-features = false }
rusqlite = { version = "0.37", features = ["bundled-sqlcipher", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1.44"
yrs = "0.28"
zeroize = "1"

[lints]
workspace = true
