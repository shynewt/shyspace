name: CI

# Every check runs locally before each commit (AGENTS.md), so CI is the
# backstop: on every push to main, on pull requests, weekly, and on demand.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
  # The release workflow runs these same checks first.
  workflow_call:

# Only what reading the code needs; a release adds its own write access to its build job.
permissions:
  contents: read

# Named after the workflow that runs the checks: called from Release, this is
# Release's run, so it never cancels or waits on CI's own run of the same ref.
# Only a pull request's older run is cancelled; every push to main gets a verdict.
concurrency:
  group: ${{ github.workflow }}-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust (format, lint, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Line numbers for backtraces without full debug info, which fills the disk.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Apt gives up on a dead mirror instead of hanging
        # A stalled Ubuntu mirror once held a job until its timeout; retry, and time out each request.
        run: printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99-timeouts
      - name: Room on the disk
        # The runner comes with toolchains we never use; the build needs the space.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: System libraries for Tauri and SQLCipher
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libssl-dev libdbus-1-dev
      - name: Rust, as rust-toolchain.toml pins it
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          # Only main saves, so branches can't crowd its cache out of the 10 GB limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: The desktop crate embeds the built frontend; give it an empty one
        run: mkdir -p apps/desktop/dist
      - name: Huddle audio's system libraries
        run: sudo apt-get install -y libasound2-dev libpipewire-0.3-dev clang libclang-dev
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Disk left
        if: always()
        run: df -h /

  lockfile:
    name: Actions lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # actions.lock pins every action to a commit; this fails if a workflow
      # uses an action the lockfile doesn't pin, or a pin no longer resolves.
      - name: Every action is pinned in actions.lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.5.1
          gh actions-lock --verify --no-interactive

  frontend:
    name: Frontend (types, lint, UI tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Apt gives up on a dead mirror instead of hanging
        # A stalled Ubuntu mirror once held a job until its timeout; retry, and time out each request.
        run: printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99-timeouts
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Find the Playwright version, for the browser cache
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ steps.playwright.outputs.version }}
      # The app ships in WebKit; Chromium runs locally, where it's the fast loop.
      - run: pnpm exec playwright install --with-deps webkit
      - run: pnpm test:ui --forbid-only --reporter=github
        env:
          UI_TEST_BROWSERS: webkit
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: ui-test-traces
          path: apps/desktop/test-results/
          retention-days: 7

  app:
    name: Desktop app (real UI, real bucket)
    # The slowest job: it builds the whole app. Only when asked for.
    # Not when a release calls these checks: there it would only add time.
    if: github.workflow == 'CI' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Line numbers for backtraces without full debug info, which fills the disk.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Apt gives up on a dead mirror instead of hanging
        # A stalled Ubuntu mirror once held a job until its timeout; retry, and time out each request.
        run: printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99-timeouts
      - name: Room on the disk
        # The runner comes with toolchains we never use; the build needs the space.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: System libraries, WebKit's WebDriver, a virtual display and a keychain
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libssl-dev libdbus-1-dev \
            libasound2-dev libpipewire-0.3-dev clang libclang-dev \
            webkit2gtk-driver xvfb gnome-keyring dbus-x11
      - name: A local S3 bucket
        run: |
          docker run -d --name s3 -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=shyadmin -e RUSTFS_SECRET_KEY=shysecret123 docker.io/rustfs/rustfs:1.0.6
          # The server answers 503 until its storage is ready.
          for attempt in $(seq 60); do
            curl -sf --aws-sigv4 "aws:amz:us-east-1:s3" --user shyadmin:shysecret123 -X PUT http://localhost:9000/shyspace && exit 0
            sleep 1
          done
          echo "the bucket did not come up" && exit 1
      - name: Rust, as rust-toolchain.toml pins it
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          # Only main saves, so branches can't crowd its cache out of the 10 GB limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo install tauri-driver --locked
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Build the app and the CLI
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --debug --no-bundle
          cargo build -p shy-cli
      - name: Run the app tests
        working-directory: apps/desktop
        run: |
          dbus-run-session -- sh -c '
            printf test | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            xvfb-run -a pnpm test:app'
      - name: Disk left
        if: always()
        run: df -h /

  android:
    name: Android (tests, lint, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Room on the disk
        # The build image brings its own SDK and NDK; the runner's copies only take space.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      # Gradle, Maven, crates and Robolectric's Android runtimes, as on a developer's machine.
      - uses: actions/cache@v6.1.0
        with:
          path: /var/tmp/shyspace-android-cache
          key: android-${{ hashFiles('apps/android/gradle/libs.versions.toml', 'apps/android/gradle/wrapper/gradle-wrapper.properties', 'Cargo.lock') }}
          restore-keys: android-
      - name: Tests, lint and the debug build, in the build image
        run: make -C apps/android check CONTAINER=docker
      - name: Disk left
        if: always()
        run: df -h /
