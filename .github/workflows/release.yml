name: Release

# Builds the desktop app and the `shy` CLI for Linux, macOS (Apple Silicon)
# and Windows, after the same checks as CI. A version tag (v0.1.0) attaches
# them to a draft GitHub release. Everything else builds them as workflow
# artifacts only: the Actions tab's button, a pull request that changes the
# workflows or the app's bundle settings, and a weekly run that notices a
# retired runner or a broken build before a release needs it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/**", "apps/desktop/src-tauri/tauri.conf.json"]
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build (${{ matrix.name }})
    needs: checks
    # Only this job writes: it attaches the builds to the draft release.
    permissions:
      contents: write
    # A tag's build signs the updates, with the key only the `release`
    # environment holds (and only for v* tags); other runs build without it.
    environment: ${{ github.ref_type == 'tag' && 'release' || '' }}
    strategy:
      fail-fast: false
      matrix:
        # Explicit images, never -latest: a moving label would change the
        # build machine, and with Linux the oldest system the packages run on.
        include:
          - name: Linux
            runner: ubuntu-24.04
          - name: macOS (Apple Silicon)
            runner: macos-26
          - name: Windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: A tag releases the app's version, with the updater's public key
        if: github.ref_type == 'tag'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        # Apps built without the key can never update themselves, and a tag
        # that isn't the app's version would be offered as the wrong one.
        run: |
          config=apps/desktop/src-tauri/tauri.conf.json
          test "v$(jq -r .version "$config")" = "$TAG" || { echo "::error::$TAG isn't the version in $config"; exit 1; }
          test -n "$(jq -r '.plugins.updater.pubkey // empty' "$config")" || { echo "::error::plugins.updater.pubkey in $config is empty"; exit 1; }
      - name: Apt gives up on a dead mirror instead of hanging
        if: runner.os == 'Linux'
        # A stalled Ubuntu mirror once held a job until its timeout; retry, and time out each request.
        run: printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99-timeouts
      - name: Room on the disk
        if: runner.os == 'Linux'
        # The runner comes with toolchains we never use; the build needs the space.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libdbus-1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - name: Rust, as rust-toolchain.toml pins it
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          # The weekly run keeps the release cache warm; other runs only read it.
          save-if: ${{ github.event_name == 'schedule' }}
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - name: Huddle audio's system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libasound2-dev libpipewire-0.3-dev clang libclang-dev
      - name: Developer ID signing and notarization for a tag
        if: github.ref_type == 'tag' && runner.os == 'macOS'
        # Set only here: an empty variable on other runs could make the build
        # try an empty certificate. The identity replaces the ad-hoc "-".
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            test -n "$value" || { echo "::error::the release environment has no $name"; exit 1; }
            delimiter="EOF_$(openssl rand -hex 16)"
            printf '%s<<%s\n%s\n%s\n' "$name" "$delimiter" "$value" "$delimiter" >> "$GITHUB_ENV"
          done
          # Named in the config too, merged over tauri.conf.json's ad-hoc "-", so
          # the identity can't lose to it.
          jq -n --arg identity "$APPLE_SIGNING_IDENTITY" '{bundle: {macOS: {signingIdentity: $identity}}}' \
            > "$RUNNER_TEMP/signing.conf.json"
      - name: Build the app, and attach it to the draft release for a tag
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          # A tag also builds the signed update packages and latest.json, which the apps update from.
          args: >-
            --features vendored-openssl
            ${{ github.ref_type == 'tag' && '--config src-tauri/tauri.release.conf.json' || '' }}
            ${{ github.ref_type == 'tag' && runner.os == 'macOS' && format('--config {0}/signing.conf.json', runner.temp) || '' }}
          # Empty without a tag, so the action only keeps workflow artifacts.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: shyspace ${{ github.ref_name }}
          releaseBody: "Installed apps update themselves once this is published. macOS: signed with a Developer ID and notarized."
          # A draft until it's looked over; published as a normal release, since apps only see the latest one.
          releaseDraft: true
          prerelease: false
          uploadWorkflowArtifacts: true
      - name: Check the macOS app's signature
        if: runner.os == 'macOS'
        run: |
          app=$(find target/release/bundle/macos -maxdepth 1 -name '*.app' | head -n 1)
          test -n "$app"
          # Ad-hoc signed: the bundle must be whole, or macOS calls it damaged.
          codesign --verify --deep --strict --verbose=2 "$app"
          # The hardened runtime blocks the microphone unless the app is entitled to it.
          has_microphone() {
            # Shown for the record: the flags say whether the runtime is on (adhoc,runtime).
            codesign -d --verbose=2 "$1" 2>&1 | grep -E 'flags=|Signature=' || true
            codesign -d --entitlements - --xml "$1" 2>/dev/null | grep -q 'com.apple.security.device.audio-input' \
              || { echo "::error::$1 isn't entitled to the microphone"; return 1; }
          }
          has_microphone "$app"
          # Gatekeeper must accept a tag's app: Developer ID signed, notarized,
          # the ticket stapled. An ad-hoc build is refused; shown for information.
          is_released() {
            codesign -dvv "$1" 2>&1 | grep -q '^Authority=Developer ID Application' \
              || { echo "::error::$1 isn't signed with a Developer ID"; return 1; }
            spctl -a -vv "$1"
            xcrun stapler validate "$1"
          }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            is_released "$app"
          else
            spctl -a -vv "$app" || true
          fi
          # A tag's update package holds the app an update installs: it must be whole too.
          update=$(find target/release/bundle/macos -maxdepth 1 -name '*.app.tar.gz' | head -n 1)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test -n "$update"
            mkdir -p "$RUNNER_TEMP/update"
            tar -xzf "$update" -C "$RUNNER_TEMP/update"
            codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP"/update/*.app
            updated_app=$(find "$RUNNER_TEMP/update" -maxdepth 1 -name '*.app' | head -n 1)
            has_microphone "$updated_app"
            # An update replaces the app in place, so it carries no quarantine and
            # needs no ticket; its signature must still be the Developer ID.
            codesign -dvv "$updated_app" 2>&1 | grep -q '^Authority=Developer ID Application' \
              || { echo "::error::the update's app isn't signed with a Developer ID"; exit 1; }
          fi
      - name: Build the shy CLI
        run: cargo build --release -p shy-cli --features vendored-openssl
      - name: Attach the CLI to the draft release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Through the environment, never spliced into the script.
          MATRIX_NAME: ${{ matrix.name }}
          TAG: ${{ github.ref_name }}
        run: |
          binary=target/release/shy
          [ "$RUNNER_OS" = "Windows" ] && binary=target/release/shy.exe
          suffix=$(echo "$MATRIX_NAME" | tr 'A-Z ' 'a-z-' | tr -d '()')
          cp "$binary" "shy-$suffix${binary##*/shy}"
          gh release upload "$TAG" "shy-$suffix${binary##*/shy}" --clobber
      - name: Keep the CLI as a workflow artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: shy-${{ runner.os }}
          path: target/release/shy*
          retention-days: 7
      - name: Disk left
        if: always() && runner.os == 'Linux'
        run: df -h /

  feed:
    name: Check the update feed
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Only a token that can write sees a draft release; this job only reads it.
    permissions:
      contents: write
    steps:
      - name: latest.json offers this version to every kind of install
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        # Each platform's builds upload to latest.json separately; one missing
        # leaves those installs on the old version without a word. An app
        # takes the entry for its own kind of install, else its platform's
        # plain one, and only installs a package of its own kind. Apps also
        # refuse a package whose signature's trusted comment names another
        # version than latest.json offers (`requireSignedVersion`), so that
        # is checked here too rather than found when nobody can update.
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir "$RUNNER_TEMP"
          feed="$RUNNER_TEMP/latest.json"
          # latest.json points at assets by API URL; the file name says what kind of package it is.
          assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | map({(.apiUrl): .name}) | add')
          version=$(jq -r .version "$feed")
          test "v${version#v}" = "$TAG" || { echo "::error::latest.json offers $version, not $TAG"; exit 1; }
          while read -r platform installer package; do
            jq -e --arg platform "$platform" --arg installer "$installer" --arg package "$package" --argjson assets "$assets" '
              (.platforms["\($platform)-\($installer)"] // .platforms[$platform]) as $entry
              | ($assets[$entry.url // ""] // ($entry.url // "" | sub(".*/"; ""))) as $file
              | ($entry.signature // "" | length > 0) and ($file | test($package))
            ' "$feed" > /dev/null || { echo "::error::latest.json has no signed $installer update for $platform"; exit 1; }
            signed=$(jq -r --arg platform "$platform" --arg installer "$installer" '
              (.platforms["\($platform)-\($installer)"] // .platforms[$platform]).signature
              | @base64d | split("\n")[]
              | select(startswith("trusted comment: ")) | ltrimstr("trusted comment: ")
              | split("\t")[] | select(startswith("version:")) | ltrimstr("version:")
            ' "$feed")
            test "${signed#v}" = "${version#v}" || { echo "::error::the $installer update for $platform is signed for version '$signed', not $version"; exit 1; }
          done <<'INSTALLS'
          darwin-aarch64 app \.app\.tar\.gz$
          linux-x86_64 appimage \.AppImage$
          linux-x86_64 deb \.deb$
          linux-x86_64 rpm \.rpm$
          windows-x86_64 nsis -setup\.exe$
          windows-x86_64 msi \.msi$
          INSTALLS
