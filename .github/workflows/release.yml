name: Release

# Builds the desktop app and the `shy` CLI for Linux, macOS (Apple Silicon)
# and Windows, after the same checks as CI. A version tag (v0.1.0) attaches
# them to a draft GitHub release. Everything else builds them as workflow
# artifacts only: the Actions tab's button, a pull request that changes the
# workflows or the app's bundle settings, and a weekly run that notices a
# retired runner or a broken build before a release needs it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/**", "apps/desktop/src-tauri/tauri.conf.json"]
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build (${{ matrix.name }})
    needs: checks
    # Only this job writes: it attaches the builds to the draft release.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # Explicit images, never -latest: a moving label would change the
        # build machine, and with Linux the oldest system the packages run on.
        include:
          - name: Linux
            runner: ubuntu-24.04
          - name: macOS (Apple Silicon)
            runner: macos-26
          - name: Windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Apt gives up on a dead mirror instead of hanging
        if: runner.os == 'Linux'
        # A stalled Ubuntu mirror once held a job until its timeout; retry, and time out each request.
        run: printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99-timeouts
      - name: Room on the disk
        if: runner.os == 'Linux'
        # The runner comes with toolchains we never use; the build needs the space.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libdbus-1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - name: Rust, as rust-toolchain.toml pins it
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # The weekly run keeps the release cache warm; other runs only read it.
          save-if: ${{ github.event_name == 'schedule' }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - name: Build the app, and attach it to the draft release for a tag
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --features vendored-openssl
          # Empty without a tag, so the action only keeps workflow artifacts.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: shyspace ${{ github.ref_name }}
          releaseBody: "Internal test build. macOS: the app isn't signed yet. Open it once, then allow it in System Settings › Privacy & Security › Open Anyway."
          releaseDraft: true
          prerelease: true
          uploadWorkflowArtifacts: true
      - name: Build the shy CLI
        run: cargo build --release -p shy-cli --features vendored-openssl
      - name: Attach the CLI to the draft release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Through the environment, never spliced into the script.
          MATRIX_NAME: ${{ matrix.name }}
          TAG: ${{ github.ref_name }}
        run: |
          binary=target/release/shy
          [ "$RUNNER_OS" = "Windows" ] && binary=target/release/shy.exe
          suffix=$(echo "$MATRIX_NAME" | tr 'A-Z ' 'a-z-' | tr -d '()')
          cp "$binary" "shy-$suffix${binary##*/shy}"
          gh release upload "$TAG" "shy-$suffix${binary##*/shy}" --clobber
      - name: Keep the CLI as a workflow artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: shy-${{ runner.os }}
          path: target/release/shy*
          retention-days: 7
      - name: Disk left
        if: always() && runner.os == 'Linux'
        run: df -h /
