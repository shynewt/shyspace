name: Release

# Builds the desktop app and the `shy` CLI for Linux, macOS (Apple Silicon)
# and Windows, after the same checks as CI. A version tag (v0.1.0) attaches
# them to a draft GitHub release; the Actions tab's button builds them as
# workflow artifacts only. macOS minutes count ten times on a private
# repository, so this never runs on its own.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.name }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
          - name: macOS (Apple Silicon)
            runner: macos-14
          - name: Windows
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # Ubuntu 24.04: huddle audio's PipeWire bindings need a newer PipeWire than 22.04 has,
      # so the packages need glibc 2.39 (Ubuntu 24.04, Debian 13, Fedora 40 or newer).
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libdbus-1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf rpm \
            libasound2-dev libpipewire-0.3-dev clang libclang-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - name: Build the app, and attach it to the draft release for a tag
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --features vendored-openssl
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: shyspace ${{ github.ref_name }}
          releaseBody: "Internal test build. macOS: the app isn't signed yet. Open it once, then allow it in System Settings › Privacy & Security › Open Anyway."
          releaseDraft: true
          prerelease: true
          uploadWorkflowArtifacts: true
      - name: Build the shy CLI
        run: cargo build --release -p shy-cli --features vendored-openssl
      - name: Attach the CLI to the draft release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          binary=target/release/shy
          [ "$RUNNER_OS" = "Windows" ] && binary=target/release/shy.exe
          suffix=$(echo "${{ matrix.name }}" | tr 'A-Z ' 'a-z-' | tr -d '()')
          cp "$binary" "shy-$suffix${binary##*/shy}"
          gh release upload "${{ github.ref_name }}" "shy-$suffix${binary##*/shy}" --clobber
      - name: Keep the CLI as a workflow artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: shy-${{ runner.os }}
          path: target/release/shy*
          retention-days: 7
